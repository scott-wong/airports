[project]
name = "airports-collector"
version = "0.1.0"
description = "Periodic OurAirports collector that maintains the airports schema in InsForge"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "psycopg2-binary>=2.9.10,<3",
  "opencc-python-reimplemented>=0.1.7,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
]

[project.scripts]
airports-collector = "airports_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airports_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
